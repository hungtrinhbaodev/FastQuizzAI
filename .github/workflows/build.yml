name: Build macOS Universal2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 3.11 is more stable for universal2 builds than 3.13 right now

      - name: Install Universal Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the fusion tool
          pip install universalPip

          # Use uPip to force-install EVERYTHING as universal2
          # This handles markupsafe, cffi, and google-genai dependencies
          uPip --install flask
          uPip --install flask-cors
          uPip --install google-genai
          uPip --install pyinstaller
          uPip --install markupsafe
          uPip --install cffi

      - name: Run Python Build Script
        run: |
          cd backend
          # Ensure we use the Python where uPip installed the universal wheels
          python build_script.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-universal-mac
          path: release/
