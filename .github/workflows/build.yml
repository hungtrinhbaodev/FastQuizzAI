name: Build macOS Universal2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Universal Dependencies
        run: |
          python -m pip install --upgrade pip
          # We force pip to install the universal2 versions of libraries
          # This ensures markupsafe and others have both Intel and ARM slices
          python -m pip install --upgrade --only-binary=:all: flask flask-cors google-genai pyinstaller markupsafe

      - name: Run Python Build Script
        run: |
          cd backend
          python build_script.py

      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-universal-mac
          path: release/
