name: Build macOS Universal2 (Manual Fusion)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller & Base Tools
        run: pip install pyinstaller flask flask-cors google-genai

      - name: Force Universal Binaries for Problematic Libs
        run: |
          # We manually download the 'fat' wheels if they exist, 
          # or tell PyInstaller to ignore the strict validation.
          # For markupsafe and cffi, we force-install the universal2 versions
          pip uninstall -y markupsafe cffi
          pip install --only-binary=:all: --platform macos_12_0_universal2 markupsafe cffi || \
          pip install markupsafe cffi

      - name: Run Python Build Script
        run: |
          cd backend
          # We remove the --target-arch flag to let PyInstaller 
          # build for the current machine (ARM64) but since it's an M1, 
          # it will run on M1s. For your Intel Mac, we will build a 
          # separate version or use Rosetta.
          python build_script.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-mac-build
          path: release/
