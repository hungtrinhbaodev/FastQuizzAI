name: Build macOS Universal2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Universal Dependencies
        run: |
          python -m pip install --upgrade pip
          # We use --platform macos_12_0_universal2 to force the 'fat' binaries
          # and --only-binary=:all: to prevent it from building a 'thin' one from source
          pip install \
            --platform macos_12_0_universal2 \
            --only-binary=:all: \
            --upgrade \
            flask flask-cors google-genai pyinstaller markupsafe

      - name: Run Python Build Script
        run: |
          cd backend
          python build_script.py

      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-universal-mac
          path: release/
