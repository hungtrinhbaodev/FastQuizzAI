name: Build macOS Universal2
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14 # The only available Silicon runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Use Python.org's version which is natively universal2
          python-version: '3.11'

      - name: Force Install Universal2 Dependencies
        run: |
          python -m pip install --upgrade pip
          mkdir universal_wheels

          # We use a more compatible platform tag
          pip download \
            --only-binary=:all: \
            --platform macosx_10_9_universal2 \
            --dest universal_wheels \
            markupsafe cffi flask flask-cors google-genai pyinstaller

          # If the above fails for any specific lib, this line catches the rest
          pip install --upgrade flask flask-cors google-genai pyinstaller

          # Install the universal wheels we found
          pip install --force-reinstall universal_wheels/*.whl

      - name: Run Python Build Script
        run: |
          cd backend
          python build_script.py # Ensure target-arch is 'universal2' in your script

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-universal-mac
          path: release/
