name: Build macOS Universal2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Clean install to ensure no "thin" cached versions are used
          pip uninstall -y markupsafe
          pip install --upgrade flask flask-cors google-genai pyinstaller
          # Installing markupsafe without specifying platform usually 
          # pulls the universal2 wheel on macOS runners automatically
          pip install markupsafe

      - name: Run Python Build Script
        run: |
          cd backend
          python build_script.py

      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-universal-mac
          path: release/
