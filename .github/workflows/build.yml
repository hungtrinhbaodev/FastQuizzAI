name: Build macOS Universal2
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14 # The only available Silicon runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Use Python.org's version which is natively universal2
          python-version: '3.11'

      - name: Force Install Universal2 Dependencies
        run: |
          python -m pip install --upgrade pip

          # Create a temp directory for universal wheels
          mkdir universal_wheels

          # Force download universal2 versions of libraries that usually cause errors
          # macos_12_0_universal2 is a safe target for current runners
          pip download \
            --only-binary=:all: \
            --platform macos_12_0_universal2 \
            --dest universal_wheels \
            markupsafe cffi flask flask-cors google-genai pyinstaller

          # Install the wheels we just downloaded
          pip install universal_wheels/*.whl

      - name: Run Python Build Script
        run: |
          cd backend
          python build_script.py # Ensure target-arch is 'universal2' in your script

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-universal-mac
          path: release/
